-- ============================================================================
-- DNSDIST MAIN CONFIGURATION (SMARTDNS STYLE)
-- ============================================================================

-- Bind ke port 5300 untuk menghindari error "Permission denied" di dalam container Docker
setLocal('0.0.0.0:5300')

-- Mengizinkan akses dari semua IP (ACL Terbuka)
setACL({"0.0.0.0/0", "::/0"})

-- Mengaktifkan Web Server di port 8083 tanpa password
webserver("0.0.0.0:8083")

-- Load SmartDNS Compatibility Plugin
dofile("/etc/dnsdist/smartdns_plugin.lua")

-------------------------------------------------------------------------------
-- KONFIGURASI PENGGUNA (Terapkan RuleAla SmartDNS Di Sini)
-------------------------------------------------------------------------------

-- 1. Buat IP set & Domain set
smartdns_ip_set("cloudflare-ipv4", "/etc/smartdns/cdn-ips/cloudflare/ipv4.txt")
smartdns_ip_set("cloudflare-ipv6", "/etc/smartdns/cdn-ips/cloudflare/ipv6.txt")
smartdns_domain_set("cf-exclude-accel", "/etc/smartdns/cdn-ips/cloudflare/exclude.txt")

-- 2. Terapkan pemetaan CNAME
-- Meniru: cname /-.api.x.com/api.x.com.cdn.cloudflare.net
smartdns_cname("-.api.x.com", "api.x.com.cdn.cloudflare.net.")

-- 3. Terapkan penggantian IP (ip-rules ip-alias)
-- Multiple target IP didukung via tabel Lua (round-robin)
-- IPv4: Semua A record yang cocok ip-set akan di-rewrite
smartdns_ip_rules_alias("cloudflare-ipv4", {"172.64.52.159", "172.64.87.224"}, "cf-exclude-accel")
-- IPv6: Semua AAAA record yang cocok ip-set akan di-rewrite
smartdns_ip_rules_alias("cloudflare-ipv6", {"2606:4700:0:970d:906d:a6e9:605b:dfd"}, "cf-exclude-accel")


-- (Tambahkan pengaturan upstream server Anda di sini, misalnya:)
newServer("1.1.1.1")
